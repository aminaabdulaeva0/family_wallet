{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход | FamilyWallet</title>
    <link rel="stylesheet" href="{% static 'expenses/style.css' %}">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-card { background: var(--card-bg); padding: 40px 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 350px; max-width: 90%; border-top: 5px solid var(--primary-color); }
        h2 { text-align: center; color: var(--primary-color); margin-top: 0; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none; transition: border 0.3s; front-size: 16px; }
        .form-group input:focus { border-color: var(--primary-color); }
        .btn { width: 100%; background: var(--primary-color); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: background 0.3s; }
        .btn:hover { background: var(--primary-hover); }
        .link { text-align: center; display: block; margin-top: 10px; color: var(--primary-color); font-size: 14px; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Вход в кошелек</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Имя пользователя</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label>Пароль</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn">Войти</button>
        </form>
        <a href="{% url 'landing' %}" class="link" style="color: #888; margin-top: 10px;">← На главную</a>
        <a href="{% url 'register' %}" class="link">Нет аккаунта? Зарегистрироваться</a>
    </div>
</body>
</html>
